apiVersion: v1
kind: ConfigMap
metadata:
  name: forgegraph-config
  namespace: default
data:
  APP_MODE: "alloydb"
  HOST: "0.0.0.0"
  PORT: "5000"
  EMBEDDING_MODEL_ID: "embeddinggemma"
  # Replace with the internal Kubernetes service name exposed by the Gemma serving deployment.
  GEMMA_API_URL: "http://gemma-service:8000/v1/chat/completions"
  GEMMA_TIMEOUT_SECONDS: "35"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgegraph
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgegraph
  template:
    metadata:
      labels:
        app: forgegraph
    spec:
      containers:
        - name: web
          image: REPLACE_WITH_YOUR_REGISTRY/forgegraph:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: forgegraph-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: forgegraph-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 8
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: forgegraph
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: forgegraph
  ports:
    - name: http
      port: 80
      targetPort: http
